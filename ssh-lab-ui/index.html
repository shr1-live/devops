<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>DevOps Lab</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --mute:#8b949e;
          --blue:#1f6feb; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
  .app { height:100%; height:100dvh; display:grid; grid-template-columns:clamp(320px,36vw,440px) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
  .views { display:none; }
  @media (max-width:800px) {
    .app { grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); }
    .views { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); }
    .views button { flex:1; } .views button.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
    aside, main { grid-column:1; grid-row:3; }
    aside { border-right:0; }
    .app.v-steps main, .app.v-term aside { display:none; }
    header { padding:8px 12px; }
    #clear { display:none; }
    .m .row { grid-template-columns:1fr; gap:2px; }
  }
  @media (max-width:480px) { #cur { display:none; } .bar .grow { flex-basis:100%; text-align:left; } }

  header { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #menu { font-size:18px; line-height:1; padding:4px 10px; }
  #build { color:var(--mute); font-size:11px; opacity:.7; white-space:nowrap; }
  @media (max-width:800px){ #build { display:none; } }
  #cur { flex:1; min-width:0; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  .drawer { position:fixed; top:0; bottom:0; left:0; width:min(300px,86vw); background:var(--bg); border-right:1px solid var(--line); z-index:21;
            transform:translateX(-100%); transition:transform .2s; padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  body.nav-open .drawer { transform:none; } body.nav-open .scrim { opacity:1; pointer-events:auto; }
  .drawer h2 { margin:10px 4px 2px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); font-weight:600; }
  .drawer .top { display:flex; align-items:center; justify-content:space-between; font-weight:600; }
  .drawer .chip { text-align:left; width:100%; padding:9px 12px; }
  .assign { display:flex; flex-direction:column; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  button { font:inherit; cursor:pointer; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 12px; }
  button:hover { border-color:#58a6ff; }
  button:disabled { opacity:.45; cursor:default; border-color:var(--line); }
  .chip.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .chip .tick { color:var(--ok); margin-left:4px; }
  .chip.on .tick { color:#fff; }

  aside { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  .goal { margin:0; padding:10px 14px 0; color:var(--mute); font-size:13px; }
  .tabs { display:flex; gap:6px; padding:10px 12px 0; flex-wrap:wrap; }
  .tab { border-radius:6px 6px 0 0; border-bottom:none; background:transparent; color:var(--mute); }
  .tab.on { background:var(--panel); color:var(--text); }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .bar .grow { flex:1; color:var(--mute); font-size:13px; text-align:right; }
  .primary { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .primary.stop { background:#da3633; border-color:#da3633; }
  .danger { color:var(--bad); }

  .complete { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; font-size:13px; }
  .complete .msg { flex:1; color:var(--mute); }
  .complete.done { background:#0f2a1a; }
  .complete.done .msg { color:var(--ok); font-weight:600; }
  .complete button.ok { background:#238636; border-color:#238636; color:#fff; font-weight:600; }

  ol { list-style:none; margin:0; padding:8px 12px 16px; overflow-y:auto; flex:1; min-height:0; }
  li { display:grid; grid-template-columns:26px minmax(0,1fr) auto; gap:8px; align-items:start; padding:8px; border-radius:8px; border:1px solid transparent; }
  li + li { margin-top:2px; }
  li.running { background:#10243f; border-color:var(--blue); }
  li.done .st { color:var(--ok); }
  li.fail { background:#2a1517; border-color:#6e2b2f; }
  li.fail .st { color:var(--bad); }
  .st { color:var(--mute); text-align:center; font-weight:700; padding-top:1px; }
  li.running .st { color:var(--blue); }
  .desc { font-weight:600; }
  code { white-space:pre-wrap; display:block; color:var(--mute); font:12px ui-monospace, Consolas, monospace; margin-top:2px; overflow-wrap:anywhere; }
  .why { margin-top:5px; padding:5px 8px; border-left:2px solid #388bfd; background:#10213a; color:#b6d4ff; font-size:12.5px; border-radius:0 6px 6px 0; }
  li.running .why { background:#14305a; color:#dbe9ff; }
  code.failout { color:#ff9b95; border-left:2px solid var(--bad); padding-left:8px; margin-top:6px; }
  .go { padding:2px 9px; font-size:12px; }
  .note { color:var(--mute); font-size:12.5px; padding:2px 8px 8px; }

  .m { margin:0 0 12px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .m > code { color:var(--text); font-size:13px; margin:0 0 8px; }
  .m .row { display:grid; grid-template-columns:150px minmax(0,1fr); gap:10px; padding:4px 0; border-top:1px solid var(--line); }
  .m .part { font:12.5px ui-monospace, Consolas, monospace; color:#79c0ff; overflow-wrap:anywhere; }
  .listwrap { display:block; }

  main { position:relative; min-height:0; background:#0b0f14; }
  #term { position:absolute; inset:0; padding:8px 0 0 10px; }
  .xterm .xterm-viewport { background-color:#0b0f14 !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <button id="menu" aria-label="Open menu" aria-expanded="false">☰</button>
    <h1>DevOps Lab</h1>
    <span id="cur"></span><span id="build" title="If this time is old after a refresh, the browser is showing a cached copy">build 26 Nov 18:40</span>
    <span class="dot" id="dot"></span><span id="status">Connecting…</span>
    <button id="clear">Clear screen</button>
  </header>

  <div class="views" id="views"><button data-v="steps" class="on">Steps</button><button data-v="term">Terminal</button></div>

  <aside>
    <p class="goal" id="goal"></p>
    <div class="tabs" id="tabs"></div>
    <div class="bar" id="bar">
      <button class="primary" id="runall">▶ Run all, one by one</button>
      <button id="clearticks" title="Clear the green ticks (does not change the machine)">Clear ticks</button>
      <button class="danger" id="reset" title="Delete the lab users and folders so you can start again">Reset lab</button>
      <span class="grow" id="count"></span>
    </div>
    <div class="complete" id="complete"></div>
    <ol id="steps"></ol>
  </aside>

  <main><div id="term"></div></main>
</div>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Topics and assignments">
  <div class="top"><span>DevOps Lab</span><button id="closenav" aria-label="Close menu">✕</button></div>
  <div class="assign" id="assign"></div>
</nav>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="lab-topics.js"></script>
<script>
/* ============ the assignments ============
   steps: [description, command, optional /regex/ that the output must match for the step to count as passed] */
const MEANINGS_A1 = [
  ["bash /scripts/ssh-user-lab.sh", [["bash","run a script with the bash shell"],["/scripts/ssh-user-lab.sh","the setup script: makes the users, locks the folders, sets up SSH"]]],
  ["bash /scripts/ssh-user-lab-verify.sh", [["…-verify.sh","logs in as each user over real SSH, checks 15 things, prints PASS or FAIL"]]],
  ["su - guest -c '…'", [["su","switch user"],["-","start fresh, like really logging in as them"],["guest","the user to become"],["-c '…'","run just this one command as that user, then come back to root"]]],
  ["ls /home/shivanshu", [["ls","list what is inside a folder"],["/home/shivanshu","the folder to look in"]]],
  ["cat FILE", [["cat","print a file's contents on the screen"]]],
  ["ls -ld A B", [["-l","long format: shows the permissions, like drwx------"],["-d","show the folder itself, not what is inside it"]]],
  ["useradd -m -s /bin/bash guest", [["useradd","create a new user"],["-m","also create their home folder"],["-s /bin/bash","give them the bash shell to log in with"],["guest","the new user's name"]]],
  ["echo 'guest:Pass123' | chpasswd", [["echo '…'","print the text user:password"],["|","pipe: hand that text to the next command"],["chpasswd","set the password from user:password"]]],
  ["mkdir PATH", [["mkdir","make a new folder"]]],
  ["echo 'text' > FILE", [["echo 'text'","print the text"],[">","send it into a file instead of the screen (replaces the file)"]]],
  ["chmod 700 /home/shivanshu", [["chmod","change who can read, write or enter"],["7","owner: read 4 + write 2 + enter 1"],["0","group: nothing"],["0","everyone else: nothing"]]],
  ["groupadd team", [["groupadd","create a group of users"],["team","the group's name"]]],
  ["usermod -aG team guest", [["usermod","change an existing user"],["-a","add to the group, keep their other groups"],["-G team","the group to add them to"]]],
  ["chown shivanshu:team A B", [["chown","change who owns a file or folder"],["shivanshu:team","new owner : new group"]]],
  ["chmod 750 /srv/share", [["7","owner: read, write, enter"],["5","group (team): read 4 + enter 1, no write"],["0","everyone else: nothing"]]],
  ["chmod 640 /srv/share/runbook.md", [["6","owner: read + write"],["4","group (team): read only"],["0","everyone else: nothing"]]],
  ["touch /srv/share/x", [["touch","create an empty file, which tests if you are allowed to write there"]]],
  ["getent group team; ls -l /srv/share", [["getent group team","show the team group and its members"],[";","then run the next command"],["ls -l","list the files with their permissions"]]],
];
const HAND = [
  ["Create the login for the other person",                 "useradd -m -s /bin/bash guest"],
  ["Give guest a lab password",                             "echo 'guest:Pass123' | chpasswd"],
  ["Create your own user",                                  "useradd -m -s /bin/bash shivanshu"],
  ["Make a private folder",                                 "mkdir /home/shivanshu/secret"],
  ["Put a secret inside it",                                "echo 'private notes' > /home/shivanshu/secret/private.txt"],
  ["Lock your folder: only you can enter (700)",            "chmod 700 /home/shivanshu"],
  ["Check the lock (drwx------)",                           "ls -ld /home/shivanshu", /drwx------/],
  ["Guest tries to list your folder: blocked",              "su - guest -c 'ls /home/shivanshu'", /Permission denied/],
  ["Guest tries to read your secret: blocked",              "su - guest -c 'cat /home/shivanshu/secret/private.txt'", /Permission denied/],
  ["Make a team group",                                     "groupadd team"],
  ["Add guest to the team",                                 "usermod -aG team guest"],
  ["Make a shared folder",                                  "mkdir /srv/share"],
  ["Put a file in it",                                      "echo 'team runbook' > /srv/share/runbook.md"],
  ["Give it to your user and the team group",               "chown shivanshu:team /srv/share /srv/share/runbook.md"],
  ["Team can read, everyone else nothing (750)",            "chmod 750 /srv/share"],
  ["Keep the file itself private to the team (640)",        "chmod 640 /srv/share/runbook.md"],
  ["Guest reads the shared file: allowed",                  "su - guest -c 'cat /srv/share/runbook.md'", /team runbook/],
  ["Guest tries to write there: blocked",                   "su - guest -c 'touch /srv/share/x'", /Permission denied/],
  ["Summary: who is in the team, and how the folders look", "getent group team; ls -ld /home/shivanshu /srv/share; ls -l /srv/share"],
];
const HEALTHY = /(^|[\r\n])HEALTHY[\r\n]/;
const M2 = "bash /scripts/week1-milestone.sh ";

const ASSIGNMENTS = {
  a1: {
    name: "Assignment 1 · SSH user + folder",
    goal: "Give another person an SSH login, and keep your own folder private from them.",
    required: ["script"],
    reset: [
      "userdel -r guest; userdel guestsftp; userdel -r shivanshu; groupdel team",
      "rm -rf /srv/share /sftp /etc/ssh/authorized_keys /etc/ssh/sshd_config.d/50-ssh-user-lab.conf /root/ssh-user-lab-keys",
    ],
    tabs: {
      script: { name: "Script (fast)", steps: [
                ["Build everything: users, locked folders, SSH login",           "bash /scripts/ssh-user-lab.sh", /Done\./],
        ["Test it by logging in as each user (expect 15 passed)",        "bash /scripts/ssh-user-lab-verify.sh", /Result: 15 passed, 0 failed/],
        ["Guest tries to list my folder: blocked",                       "su - guest -c 'ls /home/shivanshu'", /Permission denied/],
        ["Guest tries to read my secret: blocked",                       "su - guest -c 'cat /home/shivanshu/secret/private.txt'", /Permission denied/],
        ["Guest reads the one file I shared: allowed",                   "su - guest -c 'cat /home/shivanshu/secret/for-guest.txt'", /hello guest/],
        ["Show the locks (the + means a special exception)",             "ls -ld /home/shivanshu /srv/share", /drwx--x---\+/],
      ]},
      hand: { name: "By hand", steps: HAND },
      meaning: { name: "What the commands mean", cards: MEANINGS_A1 },
    }
  },

  a2: {
    name: "Assignment 2 · Week 1 milestone",
    goal: "Harden SSH, run a backend under systemd, put NGINX in front with TLS, and keep it healthy with an idempotent health-check and log-rotation script.",
    required: ["do"],
    tabs: {
      do: { name: "Do it", steps: [
        ["Step 1 · Harden SSH: no root login, 3 login tries, no forwarding", M2 + "harden", /change\(s\) made/],
        ["Step 2 · Create a backend and run it as a systemd service",        M2 + "backend", /change\(s\) made/],
        ["Step 3 · Put NGINX in front: HTTPS (TLS) + reverse proxy",         M2 + "nginx", /change\(s\) made/],
        ["Step 4 · Install the health-check and log-rotation script",        M2 + "maintenance", /change\(s\) made/],
        ["See it work: an HTTPS request reaches the backend through NGINX",  "curl -ks https://localhost/", /lab-backend/],
        ["Plain HTTP is sent to HTTPS (301 redirect)",                       "curl -sI http://localhost/ | head -3", /301/],
        ["Run the health check (expect HEALTHY)",                            "lab-maintenance.sh check", HEALTHY],
        ["Run everything again: 0 changes proves it is idempotent",          M2 + "all", /Done: 0 change/],
        ["Verify every requirement (expect 0 failed)",                       M2 + "verify", /Result: \d+ passed, 0 failed/],
      ]},
      fix: { name: "Break & fix", steps: [
        ["Break it: stop the backend (on a systemd machine: systemctl stop lab-backend)", "pkill -f '^/usr/bin/python3 /opt/lab-backend/app.py$'"],
        ["The health check notices: UNHEALTHY, exit code 1",                 "lab-maintenance.sh check; echo exit=$?", /UNHEALTHY[\s\S]*exit=1/],
        ["NGINX now answers 502 Bad Gateway",                                "curl -ks https://localhost/ | grep -o '502 Bad Gateway'", /502 Bad Gateway/],
        ["Repair: run the backend step again",                               M2 + "backend", /backend answers/],
        ["Healthy again",                                                    "lab-maintenance.sh check", HEALTHY],
        ["Log rotation: make a 2 MB log, rotate it, list the result",        "head -c 2000000 /dev/zero | tr '\\0' 'x' > /var/log/lab/demo.log; lab-maintenance.sh rotate; ls -l /var/log/lab/", /demo\.log\.1\.gz/],
      ]},
      meaning: { name: "What it does", cards: [
        ["SSH hardening: /etc/ssh/sshd_config.d/00-hardening.conf", [
          ["PermitRootLogin no","nobody can SSH in directly as root"],
          ["PasswordAuthentication no","keys only, so passwords cannot be guessed. The script keeps it ON until a key exists, so you cannot lock yourself out"],
          ["MaxAuthTries 3","three wrong tries, then disconnected"],
          ["LoginGraceTime 30","30 seconds to log in, then the attempt is dropped"],
          ["ClientAliveInterval 300 / CountMax 2","dead or idle sessions are cleaned up after about 10 minutes"],
          ["X11Forwarding / AllowTcpForwarding no","close doors you do not use"],
          ["file name starts with 00-","sshd keeps the FIRST value it reads, and the cloud image's 50- file says PasswordAuthentication yes. A 99- file would be ignored"],
          ["sshd -t, then reload","test the config first, reload (not restart) so your session survives"]]],
        ["systemd unit: /etc/systemd/system/lab-backend.service", [
          ["User=labapp","runs as an unprivileged user, never root"],
          ["ExecStart=…","the command systemd runs"],
          ["Restart=always  RestartSec=2","if it crashes, systemd starts it again after 2 seconds"],
          ["ProtectSystem=strict  PrivateTmp","sandbox: it can only write to /var/log/lab"],
          ["WantedBy=multi-user.target","systemctl enable makes it start at boot"]]],
        ["NGINX: /etc/nginx/sites-available/lab", [
          ["listen 80 … return 301 https://","plain HTTP is redirected to HTTPS"],
          ["listen 443 ssl","the HTTPS door"],
          ["ssl_certificate / ssl_certificate_key","the certificate and private key (self-signed here)"],
          ["ssl_protocols TLSv1.2 TLSv1.3","old, weak TLS versions are refused"],
          ["proxy_pass http://127.0.0.1:5001","hand the request to the backend. HTTPS ends at NGINX, that is TLS termination"],
          ["proxy_set_header X-Forwarded-Proto","tells the backend the visitor really used https"],
          ["server_tokens off","do not advertise the NGINX version"],
          ["nginx -t, then reload","test the config before applying it"]]],
        ["lab-maintenance.sh (the idempotent script)", [
          ["set -euo pipefail","stop at the first error instead of carrying on"],
          ["flock","only one copy can run at a time"],
          ["exit code 0 or 1","0 = healthy, 1 = something failed. cron and monitoring read this"],
          ["rotate only if the file is 1 MiB or bigger","nothing to do means nothing changes. That is idempotent"],
          ["copy, then empty the file (copytruncate)","the app keeps writing to the same file it already has open"],
          ["RETAIN=5","keep 5 old gzip copies, delete older ones"],
          ["*/5 * * * *  (cron)","runs the check and rotation every 5 minutes"]]],
        ["Commands used in the steps", [
          ["curl -ks URL","-k accept the self-signed certificate, -s no progress bar"],
          ["curl -sI URL","-I show only the response headers"],
          ["lab-maintenance.sh check; echo exit=$?","run the check, then print its exit code"],
          ["pkill -f 'regex'","stop processes whose command line matches"],
          ["head -c 2000000 /dev/zero | tr '\\0' 'x' > FILE","make a file of 2 million 'x' characters"],
          ["bash week1-milestone.sh all  (twice)","the second run says Done: 0 change(s) made. Idempotent means safe to repeat"]]],
      ]},
      kodekloud: { name: "On KodeKloud", copyOnly: true, note: "Run these in the KodeKloud Ubuntu Playground terminal (it has real systemd). Copy each one. Get the script first: push your repo, or paste the file.", steps: [
        ["Download the script from your GitHub repo (after you push it)", "curl -fsSL https://raw.githubusercontent.com/shr1-live/devops/main/01_Working_with_shell/labs/week1-milestone/week1-milestone.sh -o week1-milestone.sh"],
        ["Read it before running it (it runs as root)",                    "less week1-milestone.sh"],
        ["Run all four steps",                                            "sudo bash week1-milestone.sh all"],
        ["Run it again: expect 0 changes",                                "sudo bash week1-milestone.sh all"],
        ["Verify every requirement",                                      "sudo bash week1-milestone.sh verify"],
        ["Show the backend is a systemd service",                         "systemctl status lab-backend --no-pager"],
        ["Break it and let the script heal it",                           "sudo systemctl stop lab-backend; sudo lab-maintenance.sh check --heal"],
        ["See the health log",                                            "tail -n 20 /var/log/lab/health.log"],
      ]},
    }
  }
};

/* ============ topics: built from lab-topics.js (Level 1 basic, Level 2 next level, Level 3 medium, Q&A) ============ */
const TOPICS = {};
for (const T of LAB) {
  const tabs = {}, required = [];
  for (const L of T.levels) {
    tabs[L.key] = { name: L.name, cwd: T.cwd, needs: L.needs, steps: L.steps.map(s => [s[0], s[1], s[2]]) };
    if (!L.optional) required.push(L.key);
  }
  if (T.server) tabs.server = { name: T.server.name, copyOnly: true, note: T.server.note, steps: T.server.steps.map(s => [s[0], s[1]]) };
  if (T.qa) tabs.qa = { name: "Interview Q&A", cards: T.qa };
  TOPICS[T.id] = { name: T.name, goal: T.goal, port: T.port, required, reset: T.reset, tabs };
}

{ const old = { ...ASSIGNMENTS }; for (const k in old) delete ASSIGNMENTS[k]; Object.assign(ASSIGNMENTS, TOPICS, old); }  // topics first, assignments last

/* ============ "what this command does", shown right under each step while it runs ============ */
const EXPLAIN = {
  "a1.script": [
    "Runs a script that creates the users, locks the folders and sets up the SSH login. Same commands as the By hand tab.",
    "Logs in as each user for real and checks 15 rules. Each line says PASS or FAIL.",
    "su - guest -c 'CMD' = run CMD as the user guest. ls lists the folder. Blocked because the folder is mode 700.",
    "cat prints a file. It fails because guest cannot even enter the parent folder.",
    "Works because an ACL (special rule) gives guest read access to this one file and search access to the folders above it.",
    "ls -l long format, -d show the folder itself. drwx--x---+ : owner full, group may enter, others nothing, + means an ACL exists.",
  ],
  "a1.hand": [
    "useradd creates the account. -m makes a home folder, -s sets the login shell.",
    "chpasswd reads user:password pairs. This sets guest's password for the lab.",
    "Your own user. Its home folder is what we will protect.",
    "mkdir makes a folder inside your home.",
    "echo 'text' > file writes text into a file (> replaces the file).",
    "chmod 700 = owner rwx, group ---, others ---. Nobody else can enter.",
    "ls -ld shows the folder's own permissions. drwx------ proves only the owner has access.",
    "su - guest -c 'ls …' runs the command as guest. Permission denied is the goal.",
    "Same idea: guest cannot read a file inside a folder it cannot enter.",
    "groupadd creates a group. Groups let you give access to several people at once.",
    "usermod -aG team guest: -G group, -a ADD (without -a guest would leave all other groups).",
    "A folder outside your home, for sharing.",
    "A file for the team to read.",
    "chown user:group sets the owner and the group of both items.",
    "750 = owner rwx, group r-x, others ---. Group can enter and read, not write.",
    "640 = owner rw-, group r--, others ---. Group can read the file only.",
    "guest is in team, so group permissions apply: reading works.",
    "Group has no w, so writing is refused. Least privilege.",
    "getent group team shows members. ls -l shows the final permissions.",
  ],
  "a2.do": [
    "Writes /etc/ssh/sshd_config.d/00-hardening.conf, tests it with sshd -t, then reloads sshd (reload keeps your session alive).",
    "Creates a system user labapp, a small Python backend on 127.0.0.1:5001 and a systemd unit (Restart=always). Without systemd it starts it directly.",
    "Installs nginx, makes a self-signed certificate, writes a server block: 443 with TLS, proxy_pass to the backend, port 80 redirects.",
    "Installs lab-maintenance.sh (health check + log rotation) and a cron entry that runs it every 5 minutes.",
    "curl -k accepts the self-signed certificate, -s is quiet. The answer comes from the backend through nginx.",
    "curl -I shows headers only. 301 + Location: https://… means HTTP is redirected to HTTPS.",
    "Checks service, backend, proxy, disk and certificate. Prints HEALTHY and exits 0, or UNHEALTHY and exits 1.",
    "Idempotent = safe to repeat. Every step checks first, so nothing changes the second time: Done: 0 change(s).",
    "Checks every requirement (SSH, backend, TLS, redirect, cron, rotation) and counts PASS and FAIL.",
  ],
  "a2.fix": [
    "pkill -f stops the process whose command line matches. Simulates a crash. (With systemd you would use systemctl stop.)",
    "check; echo exit=$? prints the script's exit code. 1 means unhealthy, which cron or monitoring would alert on.",
    "nginx is fine but the backend behind it is gone: 502 Bad Gateway.",
    "Running the step again recreates and starts the backend. Idempotent steps are safe to re-run.",
    "Check again: HEALTHY, exit 0.",
    "head -c makes a 2 MB file. rotate copies it to demo.log.1.gz, then empties the original (copytruncate).",
  ],
};

for (const T of LAB) {   // the note under each step comes from lab-topics.js
  for (const L of T.levels) EXPLAIN[T.id + "." + L.key] = L.steps.map(s => s[3]);
  if (T.server) EXPLAIN[T.id + ".server"] = T.server.steps.map(s => s[3]);
}

/* ============ saved progress (survives refresh; fine if storage is blocked) ============ */
let saved = { state: {}, completed: {} };
try { saved = Object.assign(saved, JSON.parse(localStorage.getItem("devopslab.v4") || "{}")); } catch (e) {}
for (const k of Object.keys(saved.state || {})) if (/^td./.test(k)) delete saved.state[k];
for (const k of Object.keys(saved.completed || {})) if (/^td$/.test(k)) delete saved.completed[k];
const persist = () => { try { localStorage.setItem("devopslab.v4", JSON.stringify(saved)); } catch (e) {} };

const failOut = {};
let curA = Object.keys(ASSIGNMENTS)[0], curT = Object.keys(ASSIGNMENTS[curA].tabs)[0], busy = false, stopFlag = false;
const T = () => ASSIGNMENTS[curA].tabs[curT];
const key = (a, t) => a + "." + t;
function states(a = curA, t = curT) {
  const tab = ASSIGNMENTS[a].tabs[t], k = key(a, t), len = (tab.steps || []).length;
  let s = saved.state[k];
  if (!Array.isArray(s) || s.length !== len) s = saved.state[k] = new Array(len).fill("");
  s.forEach((v, i) => { if (v === "running") s[i] = ""; });
  return s;
}
const requiredDone = (a) => ASSIGNMENTS[a].required.every(t => states(a, t).length && states(a, t).every(v => v === "done"));

/* ============ terminal (ttyd websocket) ============ */
const enc = new TextEncoder(), dec = new TextDecoder();
const dot = document.getElementById("dot"), statusEl = document.getElementById("status");
const term = new Terminal({ fontSize: 14, cursorBlink: false, scrollback: 5000,
  fontFamily: 'ui-monospace, Consolas, "Liberation Mono", monospace', theme: { background: "#0b0f14", foreground: "#e6edf3" } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit); term.open(document.getElementById("term"));
let ws = null, retry = null, lastOut = 0, tail = "", cap = null;
const send = (p, s) => { if (ws && ws.readyState === 1) ws.send(enc.encode(p + s)); };
const show = (on, t) => { dot.classList.toggle("on", on); statusEl.textContent = t; };
const clean = s => s.replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]|\x1b\][^\x07]*\x07/g, "");

let raf = 0;   // refit only when the box really changed size (a resize loop is what makes a terminal flicker)
new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
  const d = fit.proposeDimensions();
  if (!d || !d.cols || !d.rows || (d.cols === term.cols && d.rows === term.rows)) return;
  term.resize(d.cols, d.rows); send("1", JSON.stringify({ columns: d.cols, rows: d.rows }));
}); }).observe(document.getElementById("term"));

let termPort = 7683;   // 7683 = Ubuntu practice box (weeks 1 topics). 7682 = toolbox with docker (week 2+), chosen by the topic's "port"
function useTerm() {   // call after the current topic changes; reconnects only when the topic needs the other terminal
  const p = ASSIGNMENTS[curA].port || 7683;
  if (p === termPort && ws) return;
  termPort = p; const old = ws; ws = null; if (old) old.close();
  term.reset(); show(false, "Connecting to port " + p + "…"); connect();
}
function connect() {
  clearTimeout(retry);
  const sock = new WebSocket("ws://localhost:" + termPort + "/ws", ["tty"]);      // the terminal always runs on this PC
  ws = sock; sock.binaryType = "arraybuffer";
  sock.onopen = () => {
    const d = fit.proposeDimensions(); if (d && d.cols && d.rows) term.resize(d.cols, d.rows);
    sock.send(enc.encode(JSON.stringify({ AuthToken: "", columns: term.cols, rows: term.rows })));
    show(true, "Connected"); term.focus();
  };
  sock.onmessage = (e) => {
    const d = new Uint8Array(e.data); if (!d.length || d[0] !== 48) return;
    term.write(d.subarray(1)); lastOut = performance.now();
    const txt = clean(dec.decode(d.subarray(1), { stream: true }));
    tail = (tail + txt).slice(-300); if (cap !== null) cap += txt;
  };
  sock.onclose = () => { if (ws === sock) { show(false, "Not connected, retrying…"); retry = setTimeout(connect, 3000); } };
}
term.onData(d => { if (!busy) send("0", d); });   // typing is paused while steps run, so nothing breaks the flow
document.getElementById("clear").onclick = () => { term.clear(); send("0", "clear\n"); term.focus(); };

const sleep = ms => new Promise(r => setTimeout(r, ms));
/* A command is finished when output has gone quiet and the shell prompt ("# ") is back. Returns everything it printed. */
async function runCommand(cmd) {
  tail = ""; cap = ""; lastOut = performance.now();
  send("0", cmd + "\n"); await sleep(300);
  for (;;) {
    const quiet = performance.now() - lastOut;
    if ((quiet > 500 && /[#$] $/.test(tail)) || quiet > 240000 || !ws || ws.readyState !== 1) break;
    await sleep(100);
  }
  const out = cap; cap = null; return out;
}

/* ============ rendering ============ */
const $ = id => document.getElementById(id);
const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function render() {
  const A = ASSIGNMENTS[curA], tab = T(), st = tab.cards ? [] : states();
  const navItems = [];
  Object.entries(ASSIGNMENTS).forEach(([k, v], idx) => {
    if (idx === 0) navItems.push(mk("h2", "", "Practice topics"));
    if (k[0] === "a" && (idx === 0 || ASSIGNMENTS[Object.keys(ASSIGNMENTS)[idx - 1]] && Object.keys(ASSIGNMENTS)[idx - 1][0] !== "a")) navItems.push(mk("h2", "", "Assignments"));
    const b = mk("button", "chip" + (k === curA ? " on" : ""), v.name);
    if (saved.completed[k]) b.append(mk("span", "tick", "✓"));
    b.disabled = busy; b.onclick = () => { curA = k; curT = Object.keys(ASSIGNMENTS[k].tabs)[0]; setNav(false); useTerm(); render(); }; navItems.push(b);
  });
  $("assign").replaceChildren(...navItems);
  $("cur").textContent = A.name + (saved.completed[curA] ? "  ✓" : "");
  $("goal").textContent = A.goal;
  $("tabs").replaceChildren(...Object.entries(A.tabs).map(([k, v]) => {
    const b = mk("button", "tab" + (k === curT ? " on" : ""), v.name); b.disabled = busy; b.onclick = () => { curT = k; render(); }; return b;
  }));

  const runnable = !tab.cards && !tab.copyOnly;
  $("bar").style.display = runnable ? "" : "none";
  $("reset").style.display = A.reset ? "" : "none";
  $("complete").style.display = A.required.includes(curT) ? "" : "none";

  const ol = $("steps"), keep = ol.scrollTop;
  if (tab.cards) {
    ol.replaceChildren(...tab.cards.map(([title, parts]) => {
      const c = mk("div", "m"); c.append(mk("code", "", title));
      for (const [p, m] of parts) { const r = mk("div", "row"); r.append(mk("span", "part", p), mk("span", "mean", m)); c.append(r); }
      return c;
    }));
    return;
  }
  ol.replaceChildren();
  if (tab.note) ol.append(mk("p", "note", tab.note));
  tab.steps.forEach(([desc, cmd], i) => {
    const li = mk("li", st[i] || ""); li.id = "s" + i;
    const s = mk("span", "st", st[i] === "done" ? "✓" : st[i] === "fail" ? "✗" : st[i] === "running" ? "▶" : String(i + 1));
    const mid = mk("div"); mid.append(mk("div", "desc", desc), mk("code", "", cmd));
    const why = (EXPLAIN[curA + "." + curT] || [])[i]; if (why) mid.append(mk("div", "why", why));
    const fo = failOut[curA + "." + curT + "." + i]; if (st[i] === "fail" && fo) mid.append(mk("code", "failout", "Got:\n" + fo));
    const btn = mk("button", "go", tab.copyOnly ? "Copy" : "▶");
    btn.title = tab.copyOnly ? "Copy this command" : "Run only this step"; btn.disabled = busy && !tab.copyOnly;
    btn.onclick = tab.copyOnly ? () => copy(cmd, btn) : () => runSteps([i]);
    li.append(s, mid, btn); ol.append(li);
  });
  ol.scrollTop = keep;

  const done = st.filter(v => v === "done").length, bad = st.filter(v => v === "fail").length;
  if (runnable) {
    $("count").textContent = catchMsg || (done + " of " + st.length + " done" + (bad ? ", " + bad + " failed" : ""));
    const ra = $("runall"); ra.textContent = busy ? "■ Stop" : "▶ Run all, one by one"; ra.classList.toggle("stop", busy);
    $("reset").disabled = busy; $("clearticks").disabled = busy;
  }
  const c = $("complete"), isDone = !!saved.completed[curA], ready = requiredDone(curA);
  c.className = "complete" + (isDone ? " done" : "");
  c.replaceChildren();
  const msg = mk("span", "msg", isDone ? "✓ Assignment complete (" + saved.completed[curA] + ")"
    : ready ? "All required steps passed." : "Finish every step in “" + A.tabs[A.required[0]].name + "” to complete this assignment.");
  const b = mk("button", isDone ? "" : "ok", isDone ? "Undo" : "✓ Mark assignment complete");
  b.disabled = !isDone && !ready;
  b.onclick = () => { if (isDone) delete saved.completed[curA]; else saved.completed[curA] = new Date().toLocaleDateString(); persist(); render(); };
  c.append(msg, b);
}

function copy(text, btn) {
  const ok = () => { const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = t, 1200); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, () => fb(text, ok)); else fb(text, ok);
}
function fb(text, ok) { const ta = document.createElement("textarea"); ta.style.cssText = "position:fixed;opacity:0"; ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch (e) {} ta.remove(); }

function ready() {
  if (ws && ws.readyState === 1) return true;
  alert("The terminal is not connected yet. Start it with ssh-lab.cmd in D:\\Devops and wait a few seconds."); return false;
}

let catchMsg = "";
/* Run steps one by one. If you jump to a later step, every earlier step that is not done yet runs first (catch-up),
   because later steps depend on earlier ones. A tab can also say it needs another tab finished first (needs). */
async function runSteps(indexes) {
  if (busy || !ready()) return;
  busy = true; stopFlag = false;
  const a = curA, t0 = curT, tab0 = T();
  if (indexes.length > 1) { states(a, t0).fill(""); delete saved.completed[a]; }
  const seq = [];
  const need = tab0.needs;
  if (need && indexes.length === 1) ASSIGNMENTS[a].tabs[need].steps.forEach((_, j) => { if (states(a, need)[j] !== "done") seq.push([need, j]); });
  const st0 = states(a, t0);
  if (indexes.length === 1) for (let j = 0; j < indexes[0]; j++) if (st0[j] !== "done") seq.push([t0, j]);
  const prereq = seq.length;
  indexes.forEach(i => seq.push([t0, i]));
  let n = 0, cdDone = "";
  for (const [t, i] of seq) {
    if (stopFlag || !ws || ws.readyState !== 1) break;
    const steps = ASSIGNMENTS[a].tabs[t].steps, st = states(a, t), cwd = ASSIGNMENTS[a].tabs[t].cwd;
    catchMsg = n < prereq ? "Catching up step " + (i + 1) + " first…" : "";
    st[i] = "running"; if (t === curT) { render(); document.getElementById("s" + i)?.scrollIntoView({ block: "nearest" }); }
    if (cwd && cdDone !== a + "." + t) { await runCommand("cd " + cwd + " 2>/dev/null"); cdDone = a + "." + t; }   // go to the practice folder once, as its own short line
    const out = await runCommand(steps[i][1]);
    const bad = steps[i][2] && !steps[i][2].test(out); st[i] = bad ? "fail" : "done";
    failOut[a + "." + t + "." + i] = bad ? (out.trim().split(/\r?\n/).slice(-6).join("\n") || "(no output)") : "";
    persist(); render(); n++;
    if (bad && n <= prereq) { catchMsg = "Stopped: step " + (i + 1) + " failed, fix it first"; break; }
    await sleep(500);
  }
  busy = false; if (!catchMsg.startsWith("Stopped")) catchMsg = ""; render(); term.focus();
}

$("runall").onclick = () => { if (busy) { stopFlag = true; return; } runSteps(T().steps.map((_, i) => i)); };
$("clearticks").onclick = () => { if (busy) return; for (const t of Object.keys(ASSIGNMENTS[curA].tabs)) if (ASSIGNMENTS[curA].tabs[t].steps) states(curA, t).fill(""); delete saved.completed[curA]; persist(); render(); };
$("reset").onclick = async () => {
  const A = ASSIGNMENTS[curA];
  if (busy || !A.reset || !ready() || !confirm("Undo what this assignment created inside the practice container and start over?")) return;
  busy = true; render();
  for (const c of A.reset) await runCommand(c);
  for (const t of Object.keys(A.tabs)) if (A.tabs[t].steps) states(curA, t).fill("");
  delete saved.completed[curA]; persist(); busy = false; render();
};

function setNav(open) { document.body.classList.toggle("nav-open", open); $("menu").setAttribute("aria-expanded", String(open)); }
$("menu").onclick = () => setNav(!document.body.classList.contains("nav-open"));
$("closenav").onclick = $("scrim").onclick = () => setNav(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setNav(false); });
const setView = v => { const app = document.querySelector(".app"); app.classList.toggle("v-steps", v === "steps"); app.classList.toggle("v-term", v === "term");
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v === "term") setTimeout(() => { try { const d = fit.proposeDimensions(); if (d && d.cols && d.rows) term.resize(d.cols, d.rows); send("1", JSON.stringify({ columns: term.cols, rows: term.rows })); } catch (e) {} term.focus(); }, 50); };
document.querySelectorAll("#views button").forEach(b => b.onclick = () => setView(b.dataset.v));
setView("steps");
render(); connect();
</script>
</body>
</html>
